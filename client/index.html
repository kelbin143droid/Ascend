<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Cross-origin isolation for the threaded Godot Web build (SharedArrayBuffer)
         is provided by the server's COOP/COEP headers (see server/index.ts). The
         earlier COI service worker was redundant and interfered with the app, so
         unregister any stale copy still installed in a returning visitor's browser. -->
    <script>
      if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) {
            var sw = r.active || r.waiting || r.installing;
            if (sw && sw.scriptURL && sw.scriptURL.indexOf('coi-serviceworker') !== -1) r.unregister();
          });
        }).catch(function () {});
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Ascend OS — Gamify Your Daily Rituals</title>
    <meta name="description" content="Ascend OS turns your daily habits into an RPG adventure. Track rituals, earn XP, level up your stats, and evolve through five phases of personal growth." />

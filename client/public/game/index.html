html, body, #canvas {
	margin: 0;

	color: white;

}

}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {

	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":48923636,"index.wasm":37897455},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>

<style>
/* Hide Godot's native engine loading screen entirely — the gate replaces it. */
#status,#status-splash,#status-progress,#status-notice{
 display:none !important;visibility:hidden !important;opacity:0 !important}
#gate-loader{position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;
 align-items:center;justify-content:center;overflow:hidden;
 background:radial-gradient(circle at 50% 42%,#0c1330 0%,#06080f 58%,#000 100%);
 font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;color:#cdd6ff;
 transition:opacity .6s ease}
#gate-loader.done{opacity:0;pointer-events:none}
#gate-loader .portal{position:relative;width:150px;height:220px;
 border-radius:75px/110px;
 background:radial-gradient(ellipse at 50% 50%,rgba(90,130,255,.40),rgba(20,30,80,.12) 68%,transparent);
 box-shadow:0 0 70px 12px rgba(95,135,255,.45),inset 0 0 46px rgba(130,170,255,.5);
 animation:gatePulse 2.2s ease-in-out infinite}
#gate-loader .portal::before{content:"";position:absolute;inset:-7px;border-radius:inherit;
 background:conic-gradient(from 0deg,#5a7cff,#9b5cff,#4ad6ff,#5a7cff);
 filter:blur(9px);opacity:.85;z-index:-1;animation:gateSpin 4.5s linear infinite}
#gate-loader .portal::after{content:"";position:absolute;inset:0;border-radius:inherit;
 border:2px solid rgba(180,205,255,.75);animation:gatePulse 2.2s ease-in-out infinite}
#gate-loader .rune{position:absolute;bottom:18px;width:7px;height:7px;border-radius:50%;
 background:#a9caff;box-shadow:0 0 12px #6f9cff;animation:gateRise 3.2s linear infinite}
#gate-loader .label{margin-top:48px;font-size:21px;letter-spacing:6px;font-weight:700;
 text-transform:uppercase;text-shadow:0 0 14px rgba(110,150,255,.85)}
#gate-loader .label .dots::after{content:"";animation:gateDots 1.5s steps(1,end) infinite}
@keyframes gatePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes gateSpin{to{transform:rotate(360deg)}}
@keyframes gateRise{0%{transform:translateY(0) scale(.5);opacity:0}
 18%{opacity:1}100%{transform:translateY(-200px) scale(1);opacity:0}}
@keyframes gateDots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
</style>
<div id="gate-loader">
 <div class="portal">

 </div>

</div>

</script>
